name: Build Windows app (Common Molecules Finder)

# Builds the Windows .exe for the Common Molecules Finder on a GitHub Windows machine.
# (re-trigger to ensure this workflow runs and uploads its artifact)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows-compare:
    runs-on: windows-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip setuptools wheel tkinterdnd2 pandas openpyxl lxml xlsxwriter

      - name: Install PyInstaller with a freshly compiled bootloader
        # Building the bootloader from source produces a unique launcher stub that
        # antivirus engines have no signature for -> avoids the "malware" false positive.
        run: python -m pip install --no-binary pyinstaller "pyinstaller==6.11.1"

      - name: Build the app with PyInstaller
        shell: cmd
        run: >
          python -m PyInstaller --noconfirm --windowed --noupx --clean
          --name "Common Molecules Finder"
          --collect-all tkinterdnd2
          --collect-all lxml
          --collect-all numpy
          --collect-submodules pandas
          --collect-submodules openpyxl
          --collect-submodules xlsxwriter
          --hidden-import xlsxwriter
          --exclude-module matplotlib
          --exclude-module scipy
          --exclude-module PIL
          compare_ui.py

      - name: Upload the Windows app as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Common-Molecules-Finder-Windows
          path: "dist/Common Molecules Finder"
          if-no-files-found: error
