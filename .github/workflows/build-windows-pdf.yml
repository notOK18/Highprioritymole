name: Build Windows app (PDF to Excel)

# Builds the Windows .exe for the PDF to Excel app on a GitHub Windows machine,
# then uploads it as a downloadable artifact.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows-pdf:
    runs-on: windows-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip setuptools wheel tkinterdnd2 xlsxwriter pdfplumber

      - name: Install PyInstaller with a freshly compiled bootloader
        # Building the bootloader from source produces a unique launcher stub that
        # antivirus engines have no signature for -> avoids the "malware" false positive.
        run: python -m pip install --no-binary pyinstaller "pyinstaller==6.11.1"

      - name: Build the app with PyInstaller
        shell: cmd
        run: >
          python -m PyInstaller --noconfirm --windowed --noupx --clean
          --name "PDF to Excel"
          --collect-all tkinterdnd2
          --collect-all pdfplumber
          --collect-all pdfminer
          --collect-all pypdfium2
          --collect-submodules xlsxwriter
          --hidden-import xlsxwriter
          --exclude-module matplotlib
          --exclude-module scipy
          --exclude-module pandas
          --exclude-module PyQt5
          pdf_to_excel_ui.py

      - name: Upload the Windows app as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-to-Excel-Windows
          path: "dist/PDF to Excel"
          if-no-files-found: error
